<section class="section services" id="servicos" aria-labelledby="services-title">
  <div class="container">
    <header class="section-head" appReveal>
      <h2 id="services-title">Como podemos te ajudar</h2>
      <div class="ornament" aria-hidden="true">
        <svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" /></svg>
      </div>
    </header>

    <div class="services__grid">
      @for (service of services; track service.title; let i = $index) {
        <article class="card" appReveal [appRevealDelay]="i * 100">
          <span class="card__icon" aria-hidden="true">
            <app-icon [name]="service.icon" />
          </span>
          <h3 class="card__title">{{ service.title }}</h3>
          <p class="card__text">{{ service.text }}</p>
          <a class="link-more card__link" href="#contato" [attr.aria-label]="'Saiba mais sobre ' + service.title">
            Saiba mais
            <app-icon name="chevron" style="width: 14px; height: 14px" />
          </a>
        </article>
      }
    </div>
  </div>
</section>
