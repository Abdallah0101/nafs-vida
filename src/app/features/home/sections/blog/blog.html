<section class="section blog" id="blog" aria-labelledby="blog-title">
  <div class="container">
    <header class="section-head" appReveal>
      <span class="eyebrow">Blog</span>
      <h2 id="blog-title">Reflexões para a mente e o coração</h2>
      <div class="ornament" aria-hidden="true">
        <svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" /></svg>
      </div>
    </header>

    <div class="blog__grid">
      @for (post of latestPosts(); track post.slug; let i = $index) {
        <div appReveal [appRevealDelay]="i * 110" class="blog__cell">
          <app-post-card [post]="post" />
        </div>
      }
    </div>

    <div class="blog__more" appReveal [appRevealDelay]="340">
      <a class="btn btn--primary" routerLink="/blog">
        Ver todos os artigos
        <app-icon name="chevron" style="width: 16px; height: 16px" />
      </a>
    </div>
  </div>
</section>
